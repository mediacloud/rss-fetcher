# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: '^fetcher/(test|database/(versions|test)|rss/test)/.*'
repos:
  # re-resolve X.Y.latest tags to git hashes, refresh .venv
  - repo: local
    hooks:
      - id: relock/install
        name: make mc-relock install
        entry: make mc-relock install
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.4.0
    hooks:
      - id: autoflake
        args: ["--in-place", "--remove-unused-variables", "--remove-all-unused-imports"]
  - repo: https://github.com/hhatto/autopep8
    rev: v2.3.2
    hooks:
      - id: autopep8
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        args: []
        exclude: '^fetcher/database/env.py'
        language: system
        types: [python]
        require_serial: true
  - repo: http://github.com/pycqa/isort
    rev: 10.0.0b1
    hooks:
      - id: isort
        name: isort (python)
