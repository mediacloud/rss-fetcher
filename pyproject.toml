[project]
name = "rss-fetcher"
version = "1.1.0"	# ALSO: update CHANGELOG.md!
description='Media Cloud News Feed Fetcher'
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Rahul Bhargava", email = "r.bhargava@northeastern.edu"},
    {name = "Phil Budne", email = "phil@regressive.org"},
]
classifiers = [
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # If you add/update here, run "make requirements" to rebuild uv.lock
    # Entries in alphabetical order!!
    "Jinja2 ~= 3.1.0",
    "PyYAML ~= 6.0.0",    # update types-PyYAML in pre-commit below:
    "alembic ~= 1.19.0",
    "awscli ~= 1.46.0",
    "fastapi ~= 0.141.0",
    "feedparser ~= 6.0.10",
    "mc-logging @ git+https://github.com/mediacloud/system-dev-ops@mc-logging-0.2.latest#subdirectory=logging/mc-logging",
    "mediacloud ~= 5.1.0",
    "mediacloud-metadata ~= 1.4.0",
    "psycopg ~= 3.3.0",
    "python-dateutil ~= 2.9.0",
    "python-dotenv ~= 1.2.0",
    "requests ~= 2.34.0",	# includes typing!
    "sentry-sdk[fastapi] ~= 2.69.0",
    "setproctitle ~= 1.3.0",
    "sitemap-tools @ git+https://github.com/mediacloud/sitemap-tools@v5.0.latest",
    "sqlalchemy ~= 2.0.0",
    "statsd_client ~= 1.0.0",
    "uvicorn ~= 0.52.0",
    # Entries in alphabetical order, please add above this line
    # (and run "make requirements")
]

[project.optional-dependencies]
deploy = [
    "mc-deploy @ git+https://github.com/mediacloud/system-dev-ops@mc-deploy-0.17.latest#subdirectory=deploy/mc-deploy",
]

# development environment:
# additional packages for mypy belong in pre-commit section below
# ("make lint" runs mypy from private pre-commit venv)
dev = [
    "pre-commit ~= 4.6.0",
]

# dependencies for mypy (not in user venv):
# .pre-commit-config.yaml uses .pre-commit-run.sh
# to (re)install these in the pre-commit PRIVATE venv
# if this file has changed.
mypy = [
    "mypy",
    "types-PyYAML ~= 6.0.0",
]

# not tested!
test = [
    "python-dotenv",
    "pytest ~= 7.1.0",
]

[tool.mypy]
python_version = "3.10"
venv_src = "."
venv = ".venv"

# from rss-fetcher via story-indexer!
# originally from https://blog.wolt.com/engineering/2021/09/30/professional-grade-mypy-configuration/
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

# from https://quantlane.com/blog/type-checking-large-codebase/
# in the order they appear:
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_redundant_casts = true
warn_unused_configs = true

# look for local stubs to PyPI packages in top level stubs directory
mypy_path = "stubs"

# https://setuptools.pypa.io/en/latest/userguide/package_discovery.html#custom-discovery
[tool.setuptools.packages.find]
where = ["."]
include = ["server", "fetcher", "scripts"]
exclude = ["fetcher.test", "fetcher.database.test"]
namespaces = false

[project.urls]
"Homepage" = "https://mediacloud.org"
"Bug Tracker" = "https://github.com/mediacloud/rss-fetcher/issues"
"Source Code" = "https://github.com/mediacloud/rss-fetcher"
